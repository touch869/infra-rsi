# Qwen3-0.6B parallel-strategy contract for 8x Ascend 910B4.
# Baseline: TP=1, FSDP dp_shard=8. Candidates change only the parallel topology.
name: qwen3-0.6b-parallel
repo_root: /root/hyper-parallel
base_config: /root/irsi-workspace/configs/train_qwen3_06b.yaml
domain: parallel
domain_params:
  num_attention_heads: 16
  num_key_value_heads: 8
  allow_sequence_parallel: false
  parallel_ladder:
    - id: dp4
      tp_size: 1
      dp_shard_size: 4
      loss_parallel: false
      sequence_parallel: false
      description: No TP; FSDP shard over 4 ranks with 2-way parameter replication
    - id: dp2
      tp_size: 1
      dp_shard_size: 2
      loss_parallel: false
      sequence_parallel: false
      description: No TP; FSDP shard over 2 ranks with 4-way parameter replication
    - id: dp1
      tp_size: 1
      dp_shard_size: 1
      loss_parallel: false
      sequence_parallel: false
      description: No TP; fully replicated parameters on all 8 ranks
    - id: tp2-dp4
      tp_size: 2
      dp_shard_size: 4
      loss_parallel: true
      sequence_parallel: false
      description: TP across 2 ranks, FSDP shard over 4 ranks
    - id: tp2-dp2
      tp_size: 2
      dp_shard_size: 2
      loss_parallel: true
      sequence_parallel: false
      description: TP across 2 ranks, FSDP shard over 2 ranks with 2-way replication
    - id: tp2-dp1
      tp_size: 2
      dp_shard_size: 1
      loss_parallel: true
      sequence_parallel: false
      description: TP across 2 ranks, fully replicated FSDP parameters
    - id: tp4-dp2
      tp_size: 4
      dp_shard_size: 2
      loss_parallel: true
      sequence_parallel: false
      description: TP across 4 ranks, FSDP shard over 2 ranks
    - id: tp8-dp1
      tp_size: 8
      dp_shard_size: 1
      loss_parallel: true
      sequence_parallel: false
      description: TP across all 8 ranks, no FSDP parameter sharding

python: /root/miniconda3/envs/irsi/bin/python
env_setup: source /usr/local/Ascend/ascend-toolkit/latest/set_env.sh
extra_pythonpath:
  - /root/irsi-workspace

base_overrides:
  training.train_iters: 32
  activation_checkpoint.mode: full
  accelerator.tp_size: 1
  accelerator.cp_size: 1
  accelerator.ep_size: 1
  accelerator.pp_size: 1
  accelerator.sequence_parallel: false
  accelerator.loss_parallel: false
  fsdp_config.dp_shard_size: 8

writable_prefixes:
  - accelerator.
  - fsdp_config.dp_shard_size

read_only_keys:
  - training.
  - activation_checkpoint.
  - model.
  - dataset.
  - dataloader.
  - optimizer.
  - lr_scheduler.
  - mixed_precision.
  - compile.
  - fsdp_config.reshard_after_forward
  - fsdp_config.reshard_after_backward
  - fsdp_config.requires_grad_sync
  - fsdp_config.replicate_params
  - fsdp_config.edp_shard_size

metric:
  key: performance/tokens_per_second
  direction: maximize
  noise_fraction: 0.03
  warmup_steps: 8
  measured_steps: 16

workload:
  nproc: 8
  seed: 42
  determinism: true
  expect_steps: 32

gates:
  - name: receipt
  - name: parallel-engagement
  - name: numeric-parity
    params:
      rtol: 0.05
      atol: 1.0e-4
      fields:
        - loss
  - name: memory
    params:
      limit_gib: 24.0

budget:
  max_trials: 9
  timeout_min: 25
  max_repairs: 1
memory_budget_gib: 24.0
