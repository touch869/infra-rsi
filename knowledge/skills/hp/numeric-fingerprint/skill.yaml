title: Bitwise numeric fingerprint gate
when_to_use: Checking that recompute candidates preserve loss and grad_norm exactly.
tags:
  - bitwise
  - numeric
  - gate
  - fingerprint
constraints:
  - The baseline numeric fingerprint must be frozen before candidates.
  - Numeric precision is a binary PASS/FAIL gate, not a noise-band metric.
  - A mismatch makes the trial a crash and invalidates its metric.
  - Parallel candidates use `numeric-parity` with declared tolerance, not `bitwise`.
