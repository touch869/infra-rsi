title: Parallel-strategy throughput and memory frontier
when_to_use: Interpreting TP/FSDP candidates when communication overhead may dominate a small model.
tags:
  - parallel
  - throughput
  - memory
  - frontier
  - communication
constraints:
  - Compare global tokens/s, not per-rank tokens/s.
  - Keep the workload, batch size, seed, optimizer and activation-checkpoint mode fixed.
  - A lower per-rank memory is not a win if throughput falls outside the noise band.
  - TP adds all-gather/reduce-scatter; FSDP shard size changes parameter replication and communication.
