[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-rsi"
version = "0.1.0"
description = "Closed-loop experiment harness for training-infra optimization"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
jiuwen = ["openjiuwen"]
dev = ["pytest>=7"]

[project.scripts]
irsi = "irsi.cli:main"

[tool.setuptools.packages.find]
include = ["irsi*"]

[tool.setuptools.package-data]
"irsi.knowledge" = [
  "skills/analysis/README.md",
  "skills/strategy/README.md",
  "skills/validation/README.md",
  "skills/execution/README.md",
  "skills/runtime/experiment-record/SKILL.md",
